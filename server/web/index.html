<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>whisper stack</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0e1116; color: #e6e8eb;
    }
    main { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .row { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    label { font-size: .85rem; color: #8b949e; }
    input[type=password], input[type=text] {
      flex: 1; padding: .6rem .75rem; border: 1px solid #30363d;
      background: #161b22; color: #e6e8eb; border-radius: .4rem; font-size: .95rem;
    }
    button.rec {
      width: 100%; padding: 2rem; font-size: 1.4rem; font-weight: 600;
      border: 0; border-radius: 1rem; cursor: pointer;
      background: #2da44e; color: white; transition: background .15s;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    button.rec.recording { background: #cf222e; }
    button.rec:disabled { background: #444c56; cursor: wait; }
    .status { margin: 1rem 0; min-height: 1.4em; color: #8b949e; }
    .status.speaking::after {
      content: "▮"; margin-left: .35em;
      animation: pulse 1s steps(2) infinite;
    }
    @keyframes pulse { 50% { opacity: .25; } }
    /* Live VAD peak readout — only visible when VAD is running. The bar
       width tracks current peak (0..32 -> 0..100%); the threshold marker
       is a vertical line at VAD_PEAK_THRESHOLD's position so the user
       can see at a glance whether their voice is clearing the bar.   */
    .vad-meter {
      display: none; height: 4px; background: #21262d; border-radius: 2px;
      margin: .25rem 0 0; position: relative; overflow: hidden;
    }
    .vad-meter.active { display: block; }
    .vad-meter .bar {
      height: 100%; background: #2da44e; width: 0;
      transition: width 60ms linear;
    }
    .vad-meter.over .bar { background: #d29922; }
    .vad-meter .threshold {
      position: absolute; top: -1px; bottom: -1px; width: 1px;
      background: #8b949e;
    }
    .vad-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .7rem; color: #8b949e; margin-left: .5em;
    }
    .panel {
      background: #161b22; border: 1px solid #30363d;
      border-radius: .5rem; padding: .9rem 1rem; margin-top: 1rem;
    }
    .panel h2 { margin: 0 0 .4rem; font-size: .8rem; color: #8b949e;
      text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .panel p { margin: 0; line-height: 1.4; }
    .timings { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8rem; color: #8b949e; }
    .reply.streaming { border-left: 2px solid #2da44e; }
    .tools { margin-top: .4rem; font-size: .8rem; color: #8b949e;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tools .tool { display: inline-block; padding: .15rem .5rem;
      background: #1f2937; border-radius: .25rem; margin: 0 .3em .3em 0; }
    .err { color: #ff7b72; }
  </style>
</head>
<body>
<main>
  <h1>whisper stack <span style="font-size:.7em;color:#8b949e;font-weight:400;">streaming</span></h1>

  <div class="row">
    <label style="min-width: 5em;">API key:</label>
    <input id="apiKey" type="password" placeholder="optional, sent as X-API-Key" autocomplete="off">
  </div>

  <div class="row">
    <label style="min-width: 5em;">Session:</label>
    <input id="sessionId" type="text" placeholder="optional — leave blank for stateless" autocomplete="off">
  </div>

  <div class="row">
    <label style="min-width: 5em;">VAD:</label>
    <label style="flex:1;display:flex;align-items:center;gap:.5em;cursor:pointer;">
      <input id="vadEnabled" type="checkbox" checked>
      <span style="color:#8b949e;font-size:.85rem;">Auto-stop after silence (manual tap still works)</span>
    </label>
  </div>

  <div class="row">
    <label style="min-width: 5em;">Continuous:</label>
    <label style="flex:1;display:flex;align-items:center;gap:.5em;cursor:pointer;">
      <input id="continuousMode" type="checkbox">
      <span style="color:#8b949e;font-size:.85rem;">Talk back-and-forth (forces VAD on, button becomes Start/End conversation)</span>
    </label>
  </div>

  <button id="rec" class="rec">Tap to talk</button>
  <div id="status" class="status">Ready.<span id="vadNum" class="vad-num"></span></div>
  <div id="vadMeter" class="vad-meter"><div class="bar"></div><div class="threshold"></div></div>

  <div id="result" style="display:none;">
    <div class="panel"><h2>You said</h2><p id="transcript"></p></div>
    <div class="panel"><h2>Reply</h2>
      <p id="reply" class="reply"></p>
      <div id="tools" class="tools"></div>
    </div>
    <div class="panel"><h2>Routing & timings</h2><p id="meta" class="timings"></p></div>
    <div class="panel" id="sessionPanel" style="display:none;">
      <h2>Session</h2><p id="sessionFile" class="timings"></p>
    </div>
  </div>
</main>

<script>
const recBtn = document.getElementById('rec');
const statusEl = document.getElementById('status');
const result = document.getElementById('result');
const transcriptEl = document.getElementById('transcript');
const replyEl = document.getElementById('reply');
const metaEl = document.getElementById('meta');
const toolsEl = document.getElementById('tools');
const apiKeyInput = document.getElementById('apiKey');
const sessionInput = document.getElementById('sessionId');
const vadCheckbox = document.getElementById('vadEnabled');
const continuousCheckbox = document.getElementById('continuousMode');
const sessionPanel = document.getElementById('sessionPanel');
const sessionFileEl = document.getElementById('sessionFile');
const vadMeterEl = document.getElementById('vadMeter');
const vadMeterBar = vadMeterEl.querySelector('.bar');
const vadMeterThresholdLine = vadMeterEl.querySelector('.threshold');
const vadNumEl = document.getElementById('vadNum');

apiKeyInput.value = localStorage.getItem('apiKey') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('apiKey', apiKeyInput.value));

sessionInput.value = localStorage.getItem('sessionId') || '';
sessionInput.addEventListener('change', () => localStorage.setItem('sessionId', sessionInput.value.trim()));

// VAD toggle persists across sessions; defaults to on.
const _vadStored = localStorage.getItem('vadEnabled');
vadCheckbox.checked = _vadStored === null ? true : (_vadStored === '1');
vadCheckbox.addEventListener('change', () => {
  localStorage.setItem('vadEnabled', vadCheckbox.checked ? '1' : '0');
});

// Continuous mode toggle — opt-in (defaults off). Persisted independently;
// flipping it while a conversation is active doesn't end the conversation
// (you have to tap the End button), but the next IDLE state will reflect
// the new setting via updateButtonForMode().
const _contStored = localStorage.getItem('continuousMode');
continuousCheckbox.checked = _contStored === '1';
continuousCheckbox.addEventListener('change', () => {
  localStorage.setItem('continuousMode', continuousCheckbox.checked ? '1' : '0');
  updateButtonForMode();
});

// VAD tuning constants. Threshold is in Uint8 deviation-from-center units
// returned by AnalyserNode.getByteTimeDomainData (0..128 scale). Empirical
// floor in a quiet office: 1-3 silence, 3-7 breathing/HVAC/fan, 15+ normal
// speech. Threshold of 6 was too low — a quiet fan or HVAC running at peak
// 5-7 was constantly resetting the silence timer between utterances, so
// auto-stop never fired and the user had to speak twice. 12 sits in the
// gap between background noise and quiet speech; raise toward 16-20 if
// you're in a noisy room (typing, music) and have to keep tapping End.
// Drop to 8 if you're a quiet talker and your speech doesn't auto-send.
// SILENCE_MS is the dwell time below threshold (after speech has started)
// before auto-stop.
const VAD_PEAK_THRESHOLD = 12;
const VAD_SILENCE_MS = 1500;
// Phase 5B: interrupt detection while the assistant is speaking. Threshold
// is HIGHER than VAD_PEAK_THRESHOLD so speaker-bleed from the assistant's
// own audio (which leaks through the mic even with echo cancellation) is
// less likely to trigger an unintended interrupt. We also require the
// peak to stay above threshold for VAD_INTERRUPT_FRAMES consecutive
// analyser ticks — single-frame spikes from background sounds get
// debounced out.
const VAD_INTERRUPT_THRESHOLD = 22;
const VAD_INTERRUPT_FRAMES = 3;
// Small gap between SPEAKING ending and the next LISTENING starting in
// continuous mode — gives the user a beat of silence to react before the
// mic re-opens (otherwise the very tail of the assistant's last syllable
// can re-trigger VAD via speaker-bleed).
const CONTINUOUS_TURN_GAP_MS = 250;

let mediaRecorder = null;
let recChunks = [];
let mediaStream = null;
let abortCtl = null;          // AbortController for the in-flight /converse/stream fetch
let audioCtx = null;          // Lazily created on first user gesture
let nextPlayTime = 0;         // audioCtx.currentTime when the next PCM chunk should start
let activeSources = [];       // Currently scheduled BufferSources, so we can stop them on abort
let speaking = false;         // Tracks whether at least one audio chunk has been queued
let vadAnalyser = null;       // AnalyserNode reading the mic stream
let vadMicSource = null;      // MediaStreamAudioSourceNode wrapping the mic stream
let vadRafHandle = 0;         // requestAnimationFrame handle for the watcher loop
let vadMode = 'off';          // 'off' | 'silence' | 'interrupt' — see vadTick
let vadSpeechStarted = false; // True once peak crosses VAD_PEAK_THRESHOLD this turn
let vadSilenceStartMs = 0;    // performance.now() when continuous silence started (0 = not silent)
let vadInterruptFrames = 0;   // consecutive frames over VAD_INTERRUPT_THRESHOLD this turn

// Phase 5A continuous-mode state. continuousActive is the "user has tapped
// Start conversation and not End" flag, distinct from the persisted toggle:
// the toggle just configures intent, the flag drives the auto-restart loop.
let continuousActive = false;
// Phase 5B: in continuous mode the mediaStream and analyser persist across
// LISTENING / THINKING / SPEAKING transitions so we never tear down/re-acquire
// the mic — and so VAD can run during SPEAKING to detect interrupts.
// In single-turn mode these stay null and a fresh per-recording stream is
// used (legacy 4A path).
let persistentStream = null;

function vadShouldRun() {
  // Continuous mode REQUIRES VAD (otherwise turns can't end). Manual VAD
  // toggle still respected outside continuous mode.
  return continuousActive || vadCheckbox.checked;
}

function updateButtonForMode() {
  // IDLE label only — recording/sending labels are managed by start/stop.
  if (continuousActive) {
    recBtn.textContent = 'End conversation';
    recBtn.classList.remove('recording');
  } else if (mediaRecorder && mediaRecorder.state === 'recording') {
    recBtn.textContent = 'Tap to send';
  } else {
    recBtn.textContent = continuousCheckbox.checked
      ? 'Start conversation'
      : 'Tap to talk';
  }
}

function ensureAudioCtx() {
  // AudioContext creation/resume must follow a user gesture — recBtn click qualifies.
  // We let the device choose its native sample_rate; AudioBuffers carry their own
  // sample_rate (22050 from Piper) and the browser resamples for output.
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function abortInflight() {
  if (abortCtl) {
    try { abortCtl.abort(); } catch {}
    abortCtl = null;
  }
  // Stop scheduled audio so a new turn doesn't overlap with the previous one.
  for (const src of activeSources) {
    try { src.stop(); } catch {}
  }
  activeSources = [];
  nextPlayTime = 0;
  speaking = false;
}

function enqueuePcm(pcmBytes, sampleRate) {
  // pcmBytes is a Uint8Array of int16 little-endian PCM. Convert to Float32 in [-1,1]
  // and schedule playback at nextPlayTime so consecutive chunks line up gaplessly.
  const ctx = ensureAudioCtx();
  // Build an Int16Array view. Watch for byte-offset alignment — atob output is fresh
  // bytes so it's aligned, but copy defensively if not.
  let int16;
  if (pcmBytes.byteOffset % 2 === 0) {
    int16 = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength / 2);
  } else {
    const aligned = new Uint8Array(pcmBytes);
    int16 = new Int16Array(aligned.buffer, aligned.byteOffset, aligned.byteLength / 2);
  }
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

  const buffer = ctx.createBuffer(1, float32.length, sampleRate);
  buffer.copyToChannel(float32, 0);

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);

  const startAt = Math.max(nextPlayTime, ctx.currentTime + 0.02);  // tiny safety margin
  source.start(startAt);
  nextPlayTime = startAt + buffer.duration;

  activeSources.push(source);
  source.onended = () => {
    const idx = activeSources.indexOf(source);
    if (idx >= 0) activeSources.splice(idx, 1);
    if (activeSources.length === 0 && speaking) {
      speaking = false;
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'Done.';
      // Phase 5A continuous: assistant just finished speaking; if the user
      // hasn't ended the conversation, kick off the next listening turn.
      // Small gap so the speaker tail can settle before the mic re-opens
      // (otherwise speaker-bleed can re-trigger VAD via the new mic).
      if (continuousActive) {
        setTimeout(() => {
          if (continuousActive && (!mediaRecorder || mediaRecorder.state !== 'recording')) {
            startRecording().catch(err => {
              console.warn('continuous restart failed:', err);
              continuousActive = false;
              updateButtonForMode();
            });
          }
        }, CONTINUOUS_TURN_GAP_MS);
      }
    }
  };

  if (!speaking) {
    speaking = true;
    statusEl.classList.add('speaking');
    statusEl.textContent = 'Speaking';
    // Phase 5B: in continuous mode, watch the persistent mic for an interrupt
    // (user talking over the assistant) while audio is playing.
    if (continuousActive) {
      setVadMode('interrupt');
    }
  }
}

function b64ToUint8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function startRecording() {
  // In continuous mode the mediaStream persists across turns (Phase 5B);
  // acquire it on the first turn of a conversation and reuse it after.
  // In single-turn mode every recording gets a fresh stream.
  ensureAudioCtx();  // prime the audio context on user gesture
  if (continuousActive) {
    if (!persistentStream) {
      try {
        persistentStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,    // critical: keeps assistant audio out of mic for interrupt VAD
            noiseSuppression: true,
            autoGainControl: false,    // AGC fights with our peak threshold
          },
        });
      } catch (err) {
        statusEl.innerHTML = `<span class="err">Mic access denied: ${err.message}</span>`;
        return false;
      }
      attachVadToStream(persistentStream);
    }
    mediaStream = persistentStream;
  } else {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch (err) {
      statusEl.innerHTML = `<span class="err">Mic access denied: ${err.message}</span>`;
      return false;
    }
    attachVadToStream(mediaStream);
  }
  recChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
  mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime })
                       : new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start();
  recBtn.classList.add('recording');
  recBtn.textContent = continuousActive ? 'End conversation' : 'Tap to send';
  if (vadShouldRun()) {
    setVadMode('silence');
    statusEl.textContent = continuousActive
      ? 'Listening… auto-sends on silence. Tap End to stop.'
      : 'Recording… auto-stops on silence (or tap to send).';
  } else {
    setVadMode('off');
    statusEl.textContent = 'Recording… speak then tap again.';
  }
  return true;
}

function attachVadToStream(stream) {
  // Wire a MediaStreamAudioSource -> AnalyserNode (NOT connected to
  // destination, so the mic isn't echoed). Idempotent: skips if already
  // attached. The analyser is read by vadTick under whatever mode the
  // route handler has set via setVadMode.
  if (!stream || vadAnalyser) return;
  if (!audioCtx) ensureAudioCtx();
  try {
    vadMicSource = audioCtx.createMediaStreamSource(stream);
    vadAnalyser = audioCtx.createAnalyser();
    vadAnalyser.fftSize = 1024;
    vadMicSource.connect(vadAnalyser);
  } catch (err) {
    console.warn('VAD attach failed; continuing without VAD:', err);
  }
}

function detachVad() {
  if (vadRafHandle) {
    cancelAnimationFrame(vadRafHandle);
    vadRafHandle = 0;
  }
  if (vadMicSource) {
    try { vadMicSource.disconnect(); } catch {}
    vadMicSource = null;
  }
  vadAnalyser = null;
  setVadMode('off');
}

function setVadMode(mode) {
  // mode: 'off' | 'silence' (during LISTENING) | 'interrupt' (during SPEAKING)
  // Always reset per-mode counters so a state transition starts clean.
  vadMode = mode;
  vadSpeechStarted = false;
  vadSilenceStartMs = 0;
  vadInterruptFrames = 0;
  // Show/position the meter to reflect the active threshold for this mode.
  // The threshold line is at threshold/32 of the bar width, capped at 100%
  // (peaks above 32 just saturate the bar).
  if (mode === 'off') {
    vadMeterEl.classList.remove('active');
    vadNumEl.textContent = '';
  } else {
    vadMeterEl.classList.add('active');
    const t = (mode === 'interrupt') ? VAD_INTERRUPT_THRESHOLD : VAD_PEAK_THRESHOLD;
    vadMeterThresholdLine.style.left = Math.min(100, (t / 32) * 100) + '%';
  }
  if (mode !== 'off' && vadAnalyser && !vadRafHandle) {
    vadRafHandle = requestAnimationFrame(vadTick);
  }
}

function vadTick() {
  vadRafHandle = 0;
  if (!vadAnalyser || vadMode === 'off') return;
  const buf = new Uint8Array(vadAnalyser.fftSize);
  vadAnalyser.getByteTimeDomainData(buf);
  let peak = 0;
  for (let i = 0; i < buf.length; i++) {
    const dev = buf[i] >= 128 ? buf[i] - 128 : 128 - buf[i];
    if (dev > peak) peak = dev;
  }
  const now = performance.now();

  // Live readout. Bar width tracks peak; "over" class flips color
  // when peak crosses the active threshold so it's obvious whether
  // your voice is registering.
  const activeThreshold = (vadMode === 'interrupt')
    ? VAD_INTERRUPT_THRESHOLD : VAD_PEAK_THRESHOLD;
  vadMeterBar.style.width = Math.min(100, (peak / 32) * 100) + '%';
  vadMeterEl.classList.toggle('over', peak >= activeThreshold);
  vadNumEl.textContent = `peak=${peak} thresh=${activeThreshold}`;

  if (vadMode === 'silence') {
    // LISTENING — end the recording on silence-after-speech.
    if (peak >= VAD_PEAK_THRESHOLD) {
      vadSpeechStarted = true;
      vadSilenceStartMs = 0;
    } else if (vadSpeechStarted) {
      if (vadSilenceStartMs === 0) {
        vadSilenceStartMs = now;
      } else if (now - vadSilenceStartMs > VAD_SILENCE_MS) {
        stopRecording();  // setVadMode('off') happens inside
        return;
      }
    }
  } else if (vadMode === 'interrupt') {
    // SPEAKING — abort current reply if user starts talking. Higher
    // threshold + N-frame debounce so speaker-bleed and single-frame
    // background spikes don't cut the assistant off.
    if (peak >= VAD_INTERRUPT_THRESHOLD) {
      vadInterruptFrames++;
      if (vadInterruptFrames >= VAD_INTERRUPT_FRAMES) {
        triggerInterrupt();
        return;
      }
    } else {
      vadInterruptFrames = 0;
    }
  }
  vadRafHandle = requestAnimationFrame(vadTick);
}

function triggerInterrupt() {
  // User started talking while the assistant was speaking. Stop scheduled
  // audio + abort the in-flight SSE, then start a fresh recording on the
  // already-open persistent stream. The new utterance becomes the next
  // turn of the conversation; the previous (interrupted) reply is
  // dropped from the audio side, but its session turn — if any — was
  // already persisted server-side at `final` time.
  if (!continuousActive || !persistentStream) return;
  abortInflight();
  setVadMode('silence');
  statusEl.textContent = 'Interrupted — listening to you…';
  // Fresh recorder on the persistent stream. attachVadToStream is a no-op
  // because the analyser is already attached.
  recChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
  mediaRecorder = mime ? new MediaRecorder(persistentStream, { mimeType: mime })
                       : new MediaRecorder(persistentStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start();
  recBtn.classList.add('recording');
  recBtn.textContent = 'End conversation';
  recBtn.disabled = false;
}

function stopRecording() {
  setVadMode('off');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  if (continuousActive) {
    // Keep the persistent stream + analyser alive so VAD can flip to
    // 'interrupt' when the assistant starts speaking. mediaStream stays
    // pointing at persistentStream; only the MediaRecorder ends here.
  } else {
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    detachVad();
  }
  recBtn.classList.remove('recording');
  recBtn.disabled = true;
  recBtn.textContent = 'Sending…';
  statusEl.textContent = 'Sending to /converse/stream…';
}

async function handleStop() {
  // New turn — abort any prior in-flight stream + scheduled audio.
  abortInflight();

  const blob = new Blob(recChunks, { type: recChunks[0]?.type || 'audio/webm' });
  const ext = (blob.type.includes('mp4') ? '.m4a' : '.webm');

  const fd = new FormData();
  fd.append('audio', blob, `rec${ext}`);
  fd.append('play_locally', 'false');  // play on this device, not the workstation
  const sid = sessionInput.value.trim();
  if (sid) fd.append('session_id', sid);

  const headers = {};
  const key = apiKeyInput.value.trim();
  if (key) headers['X-API-Key'] = key;

  // Reset UI for the new turn.
  result.style.display = 'block';
  transcriptEl.textContent = '';
  replyEl.textContent = '';
  replyEl.classList.add('streaming');
  toolsEl.innerHTML = '';
  metaEl.textContent = '';
  sessionPanel.style.display = 'none';

  abortCtl = new AbortController();
  const t0 = performance.now();

  let r;
  try {
    r = await fetch('/converse/stream', {
      method: 'POST',
      body: fd,
      headers,
      signal: abortCtl.signal,
    });
  } catch (err) {
    if (err.name === 'AbortError') return;  // user started a new turn
    finishWithError(`Network error: ${err.message}`);
    return;
  }

  if (!r.ok) {
    let msg;
    try { msg = (await r.json()).error || r.statusText; } catch { msg = r.statusText; }
    finishWithError(`Server ${r.status}: ${msg}`);
    return;
  }

  // Re-enable the button as soon as the stream is open. The user can interrupt
  // mid-reply by tapping again — abortInflight() will tear down this stream.
  resetButton();
  statusEl.textContent = 'Listening for reply…';

  let finalEvent = null;
  try {
    await readSse(r.body, (event, data) => {
      handleSseEvent(event, data);
      if (event === 'final') finalEvent = data;
    });
  } catch (err) {
    if (err.name === 'AbortError') return;
    finishWithError(`Stream error: ${err.message}`);
    return;
  }

  replyEl.classList.remove('streaming');
  if (finalEvent) {
    const wallS = (performance.now() - t0) / 1000;
    showFinalSummary(finalEvent, wallS);
  }
}

async function readSse(body, onEvent) {
  // SSE frames: lines like "event: name" + "data: json", separated by blank line.
  // Read fetch body as a stream and split on "\n\n".
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    while (true) {
      // Tolerate \r\n line endings just in case a proxy normalized them.
      const sep = buffer.indexOf('\n\n');
      const sepCRLF = buffer.indexOf('\r\n\r\n');
      const idx = (sep >= 0 && (sepCRLF < 0 || sep < sepCRLF)) ? sep
                : (sepCRLF >= 0 ? sepCRLF : -1);
      if (idx < 0) break;
      const skip = (idx === sepCRLF) ? 4 : 2;
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + skip);
      let event = null, data = null;
      for (const line of frame.split(/\r?\n/)) {
        if (line.startsWith('event: ')) event = line.slice(7);
        else if (line.startsWith('data: ')) data = line.slice(6);
      }
      if (event && data !== null) {
        try {
          onEvent(event, JSON.parse(data));
        } catch (e) {
          console.warn('Bad SSE frame:', event, data, e);
        }
      }
    }
  }
}

function handleSseEvent(event, data) {
  switch (event) {
    case 'ready':
      statusEl.textContent = `Stream open (mode=${data.mode}).`;
      break;
    case 'transcript':
      transcriptEl.textContent = data.transcript;
      statusEl.textContent = `Transcribed in ${data.latency_s.toFixed(2)}s. Routing…`;
      break;
    case 'route': {
      const tag = data.auto_escalated ? ` (auto-escalated)` : '';
      statusEl.textContent = `Routed to ${data.route} (${data.model})${tag}. Generating…`;
      metaEl.textContent =
        `route=${data.route} (${data.model})` +
        (data.auto_escalated ? '  auto_escalated' : '') +
        (data.force_routed ? '  force_routed' : '');
      break;
    }
    case 'text':
      replyEl.textContent += data.delta;
      break;
    case 'tool_call': {
      const args = JSON.stringify(data.input || {});
      const span = document.createElement('span');
      span.className = 'tool';
      span.textContent = `→ ${data.name}(${args})`;
      span.dataset.toolId = data.id || data.name;
      toolsEl.appendChild(span);
      statusEl.textContent = `Calling ${data.name}…`;
      break;
    }
    case 'tool_result': {
      // Mark the matching tool_call span as completed.
      const id = data.id || data.name;
      const spans = toolsEl.querySelectorAll('.tool');
      for (const s of spans) {
        if (s.dataset.toolId === id && !s.dataset.done) {
          s.textContent = `${data.name} → ${data.output_chars}ch / ${data.latency_s.toFixed(2)}s`;
          s.dataset.done = '1';
          break;
        }
      }
      statusEl.textContent = `Tool returned. Generating reply…`;
      break;
    }
    case 'audio':
      enqueuePcm(b64ToUint8(data.pcm_b64), data.sample_rate);
      break;
    case 'final':
      // Summary handled by showFinalSummary in handleStop; we leave the
      // streamed reply text in place (matches what was spoken; intermediate
      // "thinking text" from tool rounds stays visible for transparency).
      break;
    case 'error':
      finishWithError(`Server: ${data.error}`);
      break;
    default:
      console.log('Unknown SSE event:', event, data);
  }
}

function showFinalSummary(d, wallS) {
  const t = d.timings || {};
  metaEl.textContent =
    `${metaEl.textContent}\n` +
    `stt=${(t.stt ?? 0).toFixed(2)}s  route=${(t.route ?? 0).toFixed(3)}s  ` +
    `llm=${(t.llm ?? 0).toFixed(2)}s  tts=${(t.tts ?? 0).toFixed(2)}s  ` +
    `total=${(t.total ?? 0).toFixed(2)}s  http_wall=${wallS.toFixed(2)}s\n` +
    `audio_duration=${(d.audio_duration_s ?? 0).toFixed(2)}s  ` +
    `tokens in=${d.llm_tokens?.input ?? '?'} out=${d.llm_tokens?.output ?? '?'}`;

  if (d.session_file) {
    sessionPanel.style.display = '';
    sessionFileEl.textContent = d.session_file;
  }
  // If no audio was scheduled (e.g., empty reply), surface "Done." now;
  // otherwise the source.onended callback will flip the status when the
  // last chunk finishes playing.
  if (activeSources.length === 0 && !speaking) {
    statusEl.textContent = 'Done.';
  }
}

function finishWithError(msg) {
  statusEl.innerHTML = `<span class="err">${msg}</span>`;
  // Auto-loop on errors would just spam the server. End the conversation
  // and let the user re-engage manually after they've seen the error.
  if (continuousActive) {
    continuousActive = false;
  }
  resetButton();
  replyEl.classList.remove('streaming');
}

function resetButton() {
  recBtn.disabled = false;
  recBtn.classList.remove('recording');
  updateButtonForMode();
}

function endContinuousConversation() {
  continuousActive = false;
  abortInflight();
  detachVad();
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // The MediaRecorder.onstop -> handleStop path would normally fire
    // /converse/stream; we don't want that here. Detach the handler
    // first so a partial recording from the abandoned turn doesn't
    // upload.
    try { mediaRecorder.onstop = null; } catch {}
    try { mediaRecorder.stop(); } catch {}
  }
  if (persistentStream) {
    persistentStream.getTracks().forEach(t => t.stop());
    persistentStream = null;
  }
  mediaStream = null;
  resetButton();
  statusEl.textContent = 'Conversation ended.';
}

recBtn.addEventListener('click', async () => {
  // Continuous mode handling is structurally different — Start/End is a
  // session-level toggle, not a per-turn one. The single-turn flow is
  // unchanged.
  if (continuousCheckbox.checked) {
    if (continuousActive) {
      endContinuousConversation();
    } else {
      continuousActive = true;
      updateButtonForMode();
      const ok = await startRecording();
      if (!ok) {
        continuousActive = false;
        updateButtonForMode();
      }
    }
    return;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    await startRecording();
  }
});

// Reflect the persisted continuous-mode toggle in the button label on load.
updateButtonForMode();
</script>
</body>
</html>
