<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640" role="img" aria-labelledby="title description">
  <title id="title">Whisper Stack backend architecture</title>
  <desc id="description">The browser connects directly to ElevenLabs Agents for WebRTC audio and receives memory-tool requests. A local Python bridge obtains a session token from ElevenLabs and returns it to the browser. The browser also uses the bridge to save, retrieve and view memories in hosted Mem0. Provider API keys stay in the bridge.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .heading { font-size: 22px; font-weight: 650; }
      .body { font-size: 17px; }
      .label { font-size: 16px; font-weight: 500; }
      .group { font-size: 18px; font-weight: 600; fill: #475569; }
      .connector { fill: none; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1020" height="640" rx="16" fill="#ffffff"/>
  <rect x="36" y="46" width="350" height="554" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="636" y="46" width="350" height="554" rx="16" fill="#fafcfb" stroke="#cbd5e1"/>
  <text class="group" x="60" y="83">Your computer</text>
  <text class="group" x="660" y="83">Hosted services</text>

  <!-- Direct voice connection stays above the setup and memory routes. -->
  <path class="connector" d="M362 180H658" stroke="#2563eb" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <text class="label" x="510" y="160" text-anchor="middle" fill="#1d4ed8">Live audio · WebRTC</text>
  <text x="510" y="205" text-anchor="middle" font-size="15" fill="#475569">Agent tool requests</text>

  <!-- The browser uses one local bridge for setup, tools and its memory viewer. -->
  <path class="connector" d="M210 266V398" stroke="#475569" marker-start="url(#slate)" marker-end="url(#slate)"/>
  <text class="label" x="228" y="320" fill="#475569">Setup + memory</text>
  <text class="label" x="228" y="345" fill="#475569">tools / viewer</text>

  <!-- Request and response follow separate parallel paths through the open center. -->
  <path class="connector" d="M362 440H470Q482 440 482 428V282Q482 270 494 270H658" stroke="#7c3aed" stroke-dasharray="6 5" marker-end="url(#purple)"/>
  <text class="label" x="570" y="253" text-anchor="middle" fill="#6d28d9">Request token</text>
  <path class="connector" d="M658 300H526Q514 300 514 312V458Q514 470 502 470H362" stroke="#7c3aed" stroke-dasharray="6 5" marker-end="url(#purple)"/>
  <text class="label" x="531" y="386" fill="#6d28d9">Session token</text>

  <path class="connector" d="M362 530H658" stroke="#c2410c" marker-start="url(#orange)" marker-end="url(#orange)"/>
  <text class="label" x="510" y="512" text-anchor="middle" fill="#9a3412">Save · recall · list</text>

  <rect x="60" y="120" width="300" height="144" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="heading" x="84" y="158" fill="#1e3a8a">Browser tester</text>
  <text class="body" x="84" y="194" fill="#334155">Microphone + speaker</text>
  <text class="body" x="84" y="224" fill="#334155">Saved-memory viewer</text>

  <rect x="60" y="400" width="300" height="170" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text class="heading" x="84" y="440" fill="#0f172a">Python bridge</text>
  <text class="body" x="84" y="477" fill="#334155">FastAPI · fixed memory owner</text>
  <text class="body" x="84" y="507" fill="#334155">Session access + memory tools</text>
  <text x="84" y="542" font-size="15" fill="#64748b">Provider API keys stay here</text>

  <rect x="660" y="120" width="300" height="208" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text class="heading" x="684" y="158" fill="#064e3b">ElevenLabs Agents</text>
  <text class="body" x="684" y="194" fill="#334155">Speech recognition</text>
  <text class="body" x="684" y="224" fill="#334155">Claude Haiku 5.5 · replies</text>
  <text class="body" x="684" y="254" fill="#334155">Flash v2 · speech</text>
  <text x="684" y="300" font-size="15" fill="#475569">Private agent + session-token API</text>

  <rect x="660" y="430" width="300" height="120" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text class="heading" x="684" y="471" fill="#7c2d12">Hosted Mem0</text>
  <text class="body" x="684" y="507" fill="#334155">Persistent facts + preferences</text>
</svg>
